apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auth-platform

resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

replicas:
  - name: user-service
    count: 2

images:
  - name: user-service
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-1.amazonaws.com/auth-platform-production/user-service
    newTag: latest

patches:
  - path: patches/deployment-patch.yaml
  - path: patches/serviceaccount-patch.yaml
