apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secret
type: Opaque
stringData:
  # Internal API Key (for service-to-service communication)
  INTERNAL_API_KEY: "${INTERNAL_API_KEY}"

  # SES Configuration
  # Get SES_FROM_EMAIL from: terraform output (or terraform.tfvars ses_email_address)
  SES_FROM_EMAIL: "${SES_FROM_EMAIL}"
  SES_FROM_NAME: "Auth Platform"
---
