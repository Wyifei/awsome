apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notification-service-monitor
  labels:
    app: notification-service
    release: prometheus
spec:
  selector:
    matchLabels:
      app: notification-service
  endpoints:
    - port: http
      path: /api/actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - auth-platform
