apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notification-service-ingress
  namespace: auth-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notification-service-health-ingress
  namespace: auth-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/actuator/health
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /health/notifications
            pathType: Exact
            backend:
              service:
                name: notification-service
                port:
                  number: 8080
