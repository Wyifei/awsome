apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auth-platform

resources:
  - ../../base

namePrefix: dev-

commonLabels:
  environment: dev

patches:
  - path: patches/deployment-patch.yaml
  - path: patches/configmap-patch.yaml

images:
  - name: notification-service
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-1.amazonaws.com/auth-platform-dev/notification-service
    newTag: dev-latest
