# Local development configuration
spring:
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/authplatform
    username: postgres
    password: postgres

  jpa:
    show-sql: true

# Disable security for local development (use mock JWT)
# Comment out to test with real Cognito
#spring.security.oauth2.resourceserver.jwt.issuer-uri: mock

# Local S3 (LocalStack)
aws:
  s3:
    avatar-bucket: local-avatars

# Logging
logging:
  level:
    com.authplatform: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
