apiVersion: v1
kind: Secret
metadata:
  name: profile-service-secret
type: Opaque
stringData:
  # Database credentials (shared Aurora with user-service)
  DB_HOST: "${AURORA_CLUSTER_ENDPOINT}"
  DB_USERNAME: "admin"
  DB_PASSWORD: "${DB_PASSWORD}"

  # Cognito User Pool ID
  COGNITO_USER_POOL_ID: "${COGNITO_USER_POOL_ID}"

  # S3 Avatar Bucket
  S3_AVATAR_BUCKET: "${S3_AVATARS_BUCKET}"

  # CloudFront Domain (for avatar URLs)
  CLOUDFRONT_DOMAIN: "${CLOUDFRONT_DOMAIN}"
---
