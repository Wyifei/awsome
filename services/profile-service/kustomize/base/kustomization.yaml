apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: profile-service

resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  # servicemonitor.yaml removed - using AWS Managed Prometheus with ADOT Collector
  # Pods have prometheus.io/* annotations for scraping

labels:
  - pairs:
      app: profile-service
      app.kubernetes.io/name: profile-service
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: auth-platform
    includeSelectors: false
