apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: profile-service
  labels:
    app: profile-service
    release: prometheus
spec:
  selector:
    matchLabels:
      app: profile-service
  namespaceSelector:
    matchNames:
      - auth-platform
  endpoints:
    - port: http
      path: /api/actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
