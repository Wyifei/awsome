apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auth-platform

resources:
  - ../../base

namePrefix: dev-

commonLabels:
  environment: dev

replicas:
  - name: user-service
    count: 1

images:
  - name: user-service
    newName: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-1.amazonaws.com/auth-platform-dev/user-service
    newTag: dev-latest

patches:
  - path: patches/deployment-patch.yaml
  - path: patches/configmap-patch.yaml

configMapGenerator:
  - name: user-service-config
    behavior: merge
    literals:
      - ENVIRONMENT=dev
      - LOG_LEVEL=DEBUG
      - SQL_LOG_LEVEL=DEBUG
