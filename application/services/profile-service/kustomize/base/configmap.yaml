apiVersion: v1
kind: ConfigMap
metadata:
  name: profile-service-config
data:
  # Spring profiles
  SPRING_PROFILES_ACTIVE: "production"
  SERVER_PORT: "8080"

  # Database (Aurora PostgreSQL - shared with user-service)
  DB_PORT: "5432"
  DB_NAME: "auth_platform"

  # AWS
  AWS_REGION: "ap-northeast-1"

  # Internal services
  NOTIFICATION_SERVICE_URL: "http://notification-service.auth-platform.svc.cluster.local:8080"

  # Logging
  LOG_LEVEL: "INFO"
  SQL_LOG_LEVEL: "WARN"

  # Actuator
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

  # Environment
  ENVIRONMENT: "production"
