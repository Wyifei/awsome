apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
data:
  # Spring profiles
  SPRING_PROFILES_ACTIVE: "production"
  SERVER_PORT: "8080"

  # AWS
  AWS_REGION: "ap-northeast-1"

  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # Actuator
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

  # Environment
  ENVIRONMENT: "production"

  # Service URLs (internal communication)
  USER_SERVICE_URL: "http://user-service.auth-platform.svc.cluster.local:8080"
  PROFILE_SERVICE_URL: "http://profile-service.auth-platform.svc.cluster.local:8080"
