name: analyzer
description: AI agent that analyzes security findings from AWS Security Hub
type: container
team: platform

container:
  ecr_pattern: "shara-analyzer"
  dockerfile: ./Dockerfile
  base_image: python:3.12-slim
  port: 8080
  health_check: /ping

language: python
framework: fastapi
runtime: python3.12

dependencies:
  - path: ./requirements.txt
    type: pip
    description: Python package dependencies

vulnerability_remediation:
  base_image:
    file: ./Dockerfile
    pattern: "FROM python:3.12-slim"
    line_prefix: "FROM"
  packages:
    - file: ./requirements.txt
      type: pip
      format: "{package}=={version}"

tags:
  - ai-agent
  - security
  - bedrock-agentcore
